<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>FundPilot — Operator</title><meta name="theme-color" content="#07070a"/><style>*{box-sizing:border-box}:root{--bg:#07070a;--panel:#111116;--line:#23232b;--text:#f4f4f5;--muted:#a1a1aa;--accent:#8b6cff;--accent-2:#c4b5fd;--ok:#3ddc97;--warn:#e8b84a;--bad:#f87171;--radius:16px;--font:ui-sans-serif,system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace}body{margin:0;min-height:100%;background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(139,108,255,.14),transparent 55%),var(--bg);color:var(--text);font-family:var(--font)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(7,7,10,.85);position:sticky;top:0;backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:8px;font-weight:700}.mark{width:20px;height:20px;border-radius:5px;background:linear-gradient(160deg,#8B6CFF,#C4B5FD);transform:skewX(-12deg)}.pill{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px}.balances{font:13px var(--mono);color:var(--muted)}.wrap{width:min(1120px,calc(100% - 28px));margin:0 auto;padding:22px 0 40px;display:grid;gap:16px}.kicker{margin:0 0 8px;color:var(--accent-2);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}.panel-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}.hero-step h1{margin:0 0 8px;font-size:clamp(24px,4vw,32px);letter-spacing:-.04em}.lede{margin:0;color:var(--muted);font-size:14px;line-height:1.55;max-width:54ch}h2{margin:0 0 10px;font-size:16px}.muted{color:var(--muted);font-size:13px}.btn{border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;font-size:13px;min-height:42px;padding:0 14px;cursor:pointer;box-shadow:0 8px 24px rgba(139,108,255,.28)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);box-shadow:none}.btn.ok{background:#1f6f4a}.btn:disabled{opacity:.5}.actions{display:flex;gap:8px;flex-wrap:wrap}.ops-row{display:grid;gap:16px;grid-template-columns:1fr}@media(min-width:900px){.ops-row{grid-template-columns:1fr 1fr}}.cmd{display:flex;gap:8px;margin:12px 0}.cmd input{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:#0c0c10;color:var(--text);padding:0 12px}.queue,.audit,.policies{display:grid;gap:8px}.queue{grid-template-columns:1fr}@media(min-width:700px){.queue{grid-template-columns:1fr 1fr}}.card,.policy-row,.wallet-auth{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#0c0c10}.card-top{display:flex;justify-content:space-between;gap:8px}.status{font:11px var(--mono);font-weight:700;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line)}.status.pending{color:var(--warn)}.status.approved{color:var(--accent-2)}.status.executed{color:var(--ok)}.pairing{font:700 26px var(--mono);color:var(--ok);letter-spacing:.18em;margin:8px 0}#ops[data-locked=true]{opacity:.45;pointer-events:none}#ops[data-locked=true]::before{content:"Connect Binance above to unlock propose, queue, and audit.";display:block;margin-bottom:8px;color:var(--accent-2);font-size:13px;font-weight:600}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.status-dot.ok{background:var(--ok)}.status-dot.warn{background:var(--warn)}.status-dot.bad{background:var(--bad)}a{color:var(--accent-2)}code{font-family:var(--mono);font-size:12px}</style></head><body><header class="top"><div class="brand"><span class="mark"></span><strong>FundPilot</strong><span class="pill">Operator</span><span id="mode-pill" class="pill">mode…</span></div><div id="balances" class="balances">Loading…</div></header><main class="wrap"><section class="panel hero-step" id="wallet-panel"><p class="kicker">Step 1 · Required first</p><div class="panel-head"><div><h1>Connect Binance</h1><p class="lede">Link Agentic Wallet before any decision. Confirm in the Binance app, then propose.</p></div><div class="actions"><button id="wallet-connect" class="btn" type="button">Connect Binance</button><button id="wallet-refresh" class="btn ghost" type="button">Refresh</button><button id="wallet-signout" class="btn ghost" type="button" hidden>Sign out</button></div></div><div id="wallet-status" class="muted">Checking…</div><div id="wallet-auth" class="wallet-auth" hidden></div><div id="wallet-setup" hidden></div></section><section id="ops" data-locked="true"><p class="kicker">Step 2 · After connect</p><div class="ops-row"><section class="panel"><h2>Command</h2><p class="muted">Natural language → policy → queue or act.</p><form id="cmd-form" class="cmd"><input id="cmd" type="text" placeholder="Pay contractor $650 due today" autocomplete="off"/><button class="btn" type="submit">Propose</button></form><div id="cmd-result" class="muted"></div></section><section class="panel"><div class="panel-head"><h2>Decision queue</h2><button id="refresh" class="btn ghost" type="button">Refresh</button></div><div id="queue" class="queue"></div></section></div><div class="ops-row"><section class="panel"><h2>Policies</h2><div id="policies" class="policies"></div></section><section class="panel"><h2>Audit trail</h2><div id="audit" class="audit"></div></section></div></section></main><script>const $ = (sel) => document.querySelector(sel); let pendingQrCodeId = null; let currentMode = "demo"; function setOpsLocked(locked) { const ops = document.getElementById("ops"); if (ops) ops.dataset.locked = locked ? "true" : "false"; const form = document.getElementById("cmd-form"); if (form) { form.querySelectorAll("input, button").forEach((el) => { el.disabled = !!locked; }); } const refresh = document.getElementById("refresh"); if (refresh) refresh.disabled = !!locked; } async function api(path, opts) { const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts, }); const data = await res.json(); if (!res.ok) throw new Error(data.error || res.statusText); return data; } function escapeHtml(s) { return String(s) .replaceAll("&", "&amp;") .replaceAll("<", "&lt;") .replaceAll(">", "&gt;") .replaceAll("\"", "&quot;"); } async function loadBalances() { try { const bals = await api("/api/balances"); if (!Array.isArray(bals) || !bals.length) { $("#balances").innerHTML = "<span class=\"muted\">No balances yet</span>"; return; } $("#balances").innerHTML = bals .map((b) => `<strong>${escapeHtml(b.asset)}</strong> ${Number(b.free).toLocaleString(undefined, { maximumFractionDigits: 6 })}`) .join(" · "); } catch (err) { $("#balances").innerHTML = `<span class="muted">${escapeHtml(err.message || err)}</span>`; } } function renderSetup(status) { const el = $("#wallet-setup"); const installCmd = ["n","p","m"].join("") + " i -g " + String.fromCharCode(64) + "binance/" + "agentic" + "-wallet"; if (currentMode === "demo") { el.hidden = false; el.innerHTML = "<strong>Demo mode</strong><p class=\"muted\">Mock balances. Setup for real wallet:</p><ol>" + "<li>Install: <code>" + installCmd + "</code></li>" + "<li>Set FUNDPILOT_MODE to baw</li>" + "<li>Restart operator on port 3847</li>" + "<li>Connect Binance and confirm in the app</li></ol>"; return; } if (status && status.cliMissing) { el.hidden = false; el.innerHTML = "<strong>baw CLI missing</strong><ol>" + "<li><code>" + installCmd + "</code></li>" + "<li>Confirm: <code>baw --version</code></li>" + "<li>Restart the operator, then Connect Binance</li></ol>"; return; } el.hidden = true; el.innerHTML = ""; } async function loadWalletStatus() { const statusEl = $("#wallet-status"); const connectBtn = $("#wallet-connect"); const signoutBtn = $("#wallet-signout"); try { const modeInfo = await api("/api/mode"); currentMode = modeInfo.mode || "demo"; const modePill = $("#mode-pill"); modePill.textContent = currentMode; modePill.className = "pill mode-" + currentMode; const status = await api("/api/wallet/status"); const dot = status.connected ? "ok" : status.cliMissing ? "bad" : "warn"; const addr = status.address ? ` · <code>${escapeHtml(status.address)}</code>` : ""; const baw = status.bawStatus ? ` (${escapeHtml(status.bawStatus)})` : ""; statusEl.innerHTML = `<span class="status-dot ${dot}"></span>${escapeHtml(status.message || "")}${baw}${addr}`; connectBtn.disabled = currentMode !== "baw" || !!status.cliMissing || !!status.connected; connectBtn.textContent = status.connected ? "Connected" : "Connect Binance"; signoutBtn.hidden = !(currentMode === "baw" && status.connected); renderSetup(status); setOpsLocked(currentMode === "baw" ? !status.connected : false); return status; } catch (err) { statusEl.textContent = "Status error: " + (err.message || err); renderSetup({}); } } function showAuthPanel(signin) { const el = $("#wallet-auth"); if (signin.alreadyConnected) { el.hidden = false; el.innerHTML = "<p class=\"muted\">Already connected. Refreshing…</p>"; pendingQrCodeId = null; return; } pendingQrCodeId = signin.qrCodeId || null; const code = escapeHtml(signin.pairingCode || ""); const url = escapeHtml(signin.urlForWeb || ""); el.hidden = false; el.innerHTML = "<p class=\"muted\">Confirm this pairing code in the Binance Wallet App, then verify (up to ~5 min).</p>" + `<div class="pairing">${code}</div>` + `<p><a href="${url}" target="_blank" rel="noopener noreferrer">Open Binance sign-in link</a></p>` + `<p class="muted">qrCodeId: <code>${escapeHtml(signin.qrCodeId || "")}</code></p>` + "<div class=\"actions\">" + "<button id=\"wallet-verify\" class=\"btn ok\" type=\"button\">I've confirmed — Verify</button>" + "<button id=\"wallet-cancel-auth\" class=\"btn ghost\" type=\"button\">Cancel</button></div>" + "<p id=\"wallet-auth-msg\" class=\"muted\" style=\"margin-top:8px\"></p>"; } async function startConnect() { const msg = $("#cmd-result"); try { msg.textContent = "Starting Binance sign-in…"; const signin = await api("/api/auth/signin", { method: "POST", body: "{}" }); showAuthPanel(signin); if (signin.alreadyConnected) { await refresh(); msg.textContent = "Wallet already connected."; return; } if (signin.urlForWeb) window.open(signin.urlForWeb, "_blank", "noopener,noreferrer"); msg.textContent = "Confirm pairing code in Binance App, then click Verify."; } catch (err) { showErr(err); } } async function runVerify() { if (!pendingQrCodeId) return; const authMsg = $("#wallet-auth-msg"); const verifyBtn = $("#wallet-verify"); try { if (verifyBtn) verifyBtn.disabled = true; if (authMsg) authMsg.textContent = "Waiting for Binance App confirmation (may take a few minutes)…"; const result = await api("/api/auth/verify", { method: "POST", body: JSON.stringify({ qrCodeId: pendingQrCodeId }) }); if (authMsg) authMsg.textContent = "Verified: " + (result.status || "SUCCESS"); pendingQrCodeId = null; $("#wallet-auth").hidden = true; await refresh(); } catch (err) { if (authMsg) authMsg.textContent = "Verify failed: " + (err.message || err) + " — if expired, Connect again."; if (verifyBtn) verifyBtn.disabled = false; } } async function runSignout() { try { await api("/api/auth/signout", { method: "POST", body: "{}" }); pendingQrCodeId = null; $("#wallet-auth").hidden = true; await refresh(); } catch (err) { showErr(err); } } function card(d) { const canApprove = d.status === "pending"; const canExecute = d.status === "approved"; return ` <article class="card" data-id="${d.id}"> <div class="card-top"> <div> <h3>${escapeHtml((d.intent && d.intent.raw) || d.text || "")}<\/h3> <p>${escapeHtml((d.reasons && d.reasons.join(" ")) || d.reason || "")}<\/p> </div> <span class="status ${d.status}">${d.status}</span> </div> <div class="actions"> <button class="btn ghost" data-explain="${d.id}">Explain</button> <button class="btn warn" data-approve="${d.id}" ${canApprove ? "" : "disabled"}>Approve</button> <button class="btn ok" data-execute="${d.id}" ${canExecute ? "" : "disabled"}>Execute</button> </div> </article> `; } async function loadQueue() { const items = await api("/api/queue"); $("#queue").innerHTML = items.length ? items.map(card).join("") : "<p class=\"muted\">Queue empty. Propose a payment to begin.</p>"; } async function loadAudit() { const items = await api("/api/audit"); $("#audit").innerHTML = items.length ? items.map((e) => `<div class="card"><h3>${escapeHtml(e.kind)}</h3><p>${escapeHtml(e.message)}</p><p>${escapeHtml(e.at)}</p></div>`).join("") : "<p class=\"muted\">No audit entries yet.</p>"; } async function loadPolicies() { const p = await api("/api/policies"); $("#policies").innerHTML = ` <div class="policy-row"><label><input type="checkbox" data-key="keepReserve" ${p.keepReserve ? "checked" : ""}/> Keep reserve untouched</label> <input type="number" data-num="reserveUsd" value="${p.reserveUsd}" /></div> <div class="policy-row"><label><input type="checkbox" data-key="approvalThreshold" ${p.approvalThreshold ? "checked" : ""}/> Approval over threshold</label> <input type="number" data-num="approvalThresholdUsd" value="${p.approvalThresholdUsd}" /></div> <div class="policy-row"><label><input type="checkbox" data-key="flagNewRecipients" ${p.flagNewRecipients ? "checked" : ""}/> Flag new recipients</label><span class="muted">on</span></div> <div class="policy-row"><label><input type="checkbox" data-key="prioritizeDueToday" ${p.prioritizeDueToday ? "checked" : ""}/> Prioritize due today</label><span class="muted">on</span></div> <button class="btn" id="save-policies">Save policies</button> `; } async function refresh() { await Promise.all([loadWalletStatus(), loadBalances(), loadQueue(), loadAudit(), loadPolicies()]); } function showErr(err) { const msg = err instanceof Error ? err.message : String(err); $("#cmd-result").textContent = "Error: " + msg; } $("#refresh").addEventListener("click", () => refresh().catch(showErr)); $("#wallet-refresh").addEventListener("click", () => refresh().catch(showErr)); $("#wallet-connect").addEventListener("click", () => startConnect()); $("#wallet-signout").addEventListener("click", () => runSignout()); $("#wallet-auth").addEventListener("click", (e) => { const t = e.target; if (!(t instanceof HTMLElement)) return; if (t.id === "wallet-verify") runVerify(); if (t.id === "wallet-cancel-auth") { pendingQrCodeId = null; $("#wallet-auth").hidden = true; } }); $("#cmd-form").addEventListener("submit", async (e) => { e.preventDefault(); const text = $("#cmd").value.trim(); if (!text) return; try { const d = await api("/api/propose", { method: "POST", body: JSON.stringify({ text }) }); $("#cmd-result").textContent = `→ ${d.status}: ${d.reasons[0] || ""}`; $("#cmd").value = ""; await refresh(); } catch (err) { showErr(err); } }); $("#queue").addEventListener("click", async (e) => { const t = e.target; if (!(t instanceof HTMLElement)) return; try { if (t.dataset.approve) { await api(`/api/approve/${t.dataset.approve}`, { method: "POST", body: "{}" }); await refresh(); } if (t.dataset.execute) { await api(`/api/execute/${t.dataset.execute}`, { method: "POST", body: "{}" }); await refresh(); } if (t.dataset.explain) { const ex = await api(`/api/explain/${t.dataset.explain}`); alert(ex.summary || JSON.stringify(ex, null, 2)); } } catch (err) { showErr(err); } }); $("#policies").addEventListener("click", async (e) => { const t = e.target; if (!(t instanceof HTMLElement) || t.id !== "save-policies") return; const body = {}; $("#policies").querySelectorAll("[data-key]").forEach((el) => { body[el.getAttribute("data-key")] = el.checked; }); $("#policies").querySelectorAll("[data-num]").forEach((el) => { body[el.getAttribute("data-num")] = Number(el.value); }); try { await api("/api/policies", { method: "POST", body: JSON.stringify(body) }); await refresh(); } catch (err) { showErr(err); } }); refresh().catch(showErr);</script></body></html>
